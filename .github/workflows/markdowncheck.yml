name: Check Markdown links

on: push

# only allow one instance of this workflow to be running per PR or branch, cancels any that are already running
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # lychee-action pulls in no other actions, so it works with the repository's
    # "require actions pinned to a full commit SHA" setting.
    - name: Run markdown link check
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        fail: true
        args: >-
          --max-retries 3
          --retry-wait-time 5
          --timeout 60
          --no-progress
          --accept '100..=103,200..=299,403'
          --exclude '^http://example\.net'
          --exclude '^http://localhost'
          './**/*.md'
